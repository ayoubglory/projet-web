<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Gestion de Restaurant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="fas fa-utensils me-2"></i>
                <span data-i18n="navbar.logo">Restaurant Manager</span>
            </a>
            <div class="d-flex align-items-center">
                <div class="dropdown me-3">
                    <button class="btn btn-outline-light dropdown-toggle" type="button" id="langDropdown" data-bs-toggle="dropdown">
                        <i class="fas fa-globe me-2"></i>
                        <span id="currentLang">FR</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="#" data-lang="fr">Français</a></li>
                        <li><a class="dropdown-item" href="#" data-lang="en">English</a></li>
                        <li><a class="dropdown-item" href="#" data-lang="ar">العربية</a></li>
                    </ul>
                </div>
                <button class="btn btn-outline-light" id="logoutBtn">
                    <i class="fas fa-sign-out-alt me-2"></i>
                    <span data-i18n="navbar.logout">Déconnexion</span>
                </button>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link active" href="#" data-route="dashboard">
                                <i class="fas fa-chart-line me-2"></i>
                                <span data-i18n="menu.dashboard">Tableau de bord</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" data-route="plats">
                                <i class="fas fa-hamburger me-2"></i>
                                <span data-i18n="menu.plats">Plats</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" data-route="commandes">
                                <i class="fas fa-shopping-cart me-2"></i>
                                <span data-i18n="menu.commandes">Commandes</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" data-route="tables">
                                <i class="fas fa-table me-2"></i>
                                <span data-i18n="menu.tables">Tables</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" data-route="reservations">
                                <i class="fas fa-calendar-check me-2"></i>
                                <span data-i18n="menu.reservations">Réservations</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" data-route="employes">
                                <i class="fas fa-users me-2"></i>
                                <span data-i18n="menu.employes">Employés</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Main content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4" id="mainContent">
                <!-- Content will be loaded here by router -->
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/router.js"></script>
    <script src="js/data.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/plats.js"></script>
    <script src="js/commandes.js"></script>
    <script src="js/tables.js"></script>
    <script src="js/reservations.js"></script>
    <script src="js/employes.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
